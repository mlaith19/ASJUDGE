plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace "com.example.tablet_app"
    compileSdkVersion 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    defaultConfig {
        // A different id from the build already on the tablets, so this installs
        // beside it instead of over it. It is also a real domain rather than the
        // template's com.example, which Play refuses and which collides with every
        // other project that never changed it.
        //
        // A new id means a new app to Android: its own storage, its own settings,
        // and a fresh deviceId - each tablet registers in the admin panel again.
        //
        // V2, AND BOTH APPS LIVE ON THE TABLET AT ONCE - ON PURPOSE.
        //
        // The evidence build is a separate app from the one judging a real show,
        // so a tablet always has the working app one home-press away. That is the
        // whole reason for the suffix: installing V2 cannot touch the build the
        // hall depends on, and going back is opening the other icon rather than
        // uninstalling anything.
        //
        // Both run full kiosk. Only ONE of the two things kiosk means is
        // exclusive: startLockTask() (Android screen pinning) belongs to whichever
        // app holds it, while immersive mode and the wakelock are per-foreground-app
        // and never collide. The way across already exists and is the one the
        // operator already uses - five taps, Unlock (main.dart:187), home, open the
        // other, and it pins itself on launch (main.dart:56).
        //
        // The cost, stated so nobody is surprised by it: a separate id means
        // separate shared_preferences, so V2 carries its OWN deviceId and registers
        // as another tablet. Three tablets show six rows, and the app not running
        // reads OFFLINE. That is not noise - it is which of the two is live, without
        // having to ask.
        applicationId "net.mlsystems.arabian.judge.v2"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}
