name: tablet_app
description: Tablet WebView control app - URL from backend
publish_to: 'none'
# 1.1.0+2. It had sat at 1.0.0+1 since March, so every archived build carried the
# same name and the only thing telling them apart was a timestamp - there was no
# way to know which one was being installed on a judge's tablet, or which one a
# tablet was already running. The WebView engine and the refresh gesture changed
# under it; the number had to move with them. Bump this on every build worth
# handing to somebody.
# 2.x is the evidence build, and it is a DIFFERENT APP to Android - see the
# applicationId note in android/app/build.gradle. Its build numbers are therefore
# their own series and have nothing to do with the 1.x running in the hall; the
# two never install over each other.
version: 2.0.2+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Android's own SwipeRefreshLayout, which is the only way to get pull-to-refresh
  # over a WebView: webview_flutter swallows the drag before Flutter sees it, so a
  # RefreshIndicator around it never fires. See the note at the top of
  # lib/screens/webview_screen.dart.
  flutter_inappwebview: ^6.1.5
  shared_preferences: ^2.2.2
  http: ^1.2.0
  socket_io_client: ^2.0.3+1
  battery_plus: ^6.0.3
  connectivity_plus: ^6.0.3
  network_info_plus: ^5.0.2
  wakelock_plus: ^1.2.8
  uuid: ^4.4.0
  # Where the evidence files go. Stage 2 of the capture plan - the tablet
  # keeps them itself until the upload exists.
  path_provider: ^2.1.3
  permission_handler: ^11.3.0
  vibration: ^2.0.0
  flutter_ringtone_player: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: true
  image_path: "assets/app_logo.png"
  # The dark the logo was drawn for. A white plate behind a dark square icon
  # would show as a ring of white around it on Android 8 and up.
  adaptive_icon_background: "#111111"
  # A separate, transparent layer: an adaptive icon is cropped to whatever mask
  # the launcher uses - circle, squircle, teardrop - and only the middle 66% is
  # guaranteed to survive. image_path above runs to the edge, so pointed at the
  # foreground it would lose the horse's ears and the film strip on a round mask.
  adaptive_icon_foreground: "assets/app_logo_foreground.png"
