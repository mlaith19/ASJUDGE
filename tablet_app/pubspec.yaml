name: tablet_app
description: Tablet WebView control app - URL from backend
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.0.0
  shared_preferences: ^2.2.2
  http: ^1.2.0
  socket_io_client: ^2.0.3+1
  battery_plus: ^6.0.3
  connectivity_plus: ^6.0.3
  network_info_plus: ^5.0.2
  wakelock_plus: ^1.2.8
  uuid: ^4.4.0
  permission_handler: ^11.3.0
  vibration: ^2.0.0
  flutter_ringtone_player: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: true
  image_path: "assets/app_logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/app_logo.png"
