<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | A.S JUDGE Admin</title>
  <link rel="stylesheet" href="admin.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      position: relative;
      overflow: hidden;
    }

    .login-bg-decoration {
      position: fixed;
      border-radius: 50%;
      filter: blur(100px);
      pointer-events: none;
    }

    .login-bg-1 {
      top: 20%;
      left: -100px;
      width: 400px;
      height: 400px;
      background: rgba(16, 185, 129, 0.1);
    }

    .login-bg-2 {
      bottom: 20%;
      right: -100px;
      width: 400px;
      height: 400px;
      background: rgba(6, 182, 212, 0.1);
    }

    .login-bg-3 {
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      height: 600px;
      background: rgba(139, 92, 246, 0.05);
    }

    .login-wrapper {
      position: relative;
      width: 100%;
      max-width: 420px;
      z-index: 10;
    }

    .login-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .login-logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 64px;
      border-radius: 16px;
      background: linear-gradient(135deg, #10b981, #06b6d4);
      margin-bottom: 1rem;
    }

    .login-logo svg {
      width: 32px;
      height: 32px;
      color: white;
    }

    .login-title {
      font-size: 1.875rem;
      font-weight: 700;
      color: white;
      margin-bottom: 0.5rem;
    }

    .login-subtitle {
      color: rgba(255, 255, 255, 0.5);
      font-size: 0.875rem;
    }

    .login-card {
      background: linear-gradient(135deg, rgba(20, 20, 35, 0.8), rgba(15, 15, 25, 0.9));
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 1rem;
      padding: 2rem;
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .login-field {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .login-label {
      font-size: 0.875rem;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.6);
    }

    .login-input-wrapper {
      position: relative;
    }

    .login-input-icon {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(255, 255, 255, 0.3);
    }

    .login-input-icon svg {
      width: 20px;
      height: 20px;
    }

    .login-input {
      width: 100%;
      padding: 1rem 1rem 1rem 3rem;
      border-radius: 0.75rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: white;
      font-size: 0.875rem;
      transition: all 0.3s ease;
    }

    .login-input:focus {
      outline: none;
      border-color: rgba(16, 185, 129, 0.5);
    }

    .login-input::placeholder {
      color: rgba(255, 255, 255, 0.3);
    }

    .login-input-password {
      padding-right: 3rem;
    }

    .login-toggle-password {
      position: absolute;
      right: 1rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.3);
      cursor: pointer;
      transition: color 0.2s ease;
    }

    .login-toggle-password:hover {
      color: rgba(255, 255, 255, 0.6);
    }

    .login-toggle-password svg {
      width: 20px;
      height: 20px;
    }

    .login-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .login-remember {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
    }

    .login-remember input {
      width: 16px;
      height: 16px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.05);
    }

    .login-remember span {
      font-size: 0.875rem;
      color: rgba(255, 255, 255, 0.5);
    }

    .login-forgot {
      font-size: 0.875rem;
      color: #10b981;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .login-forgot:hover {
      color: #34d399;
    }

    .login-submit {
      width: 100%;
      padding: 1rem;
      border-radius: 0.75rem;
      background: linear-gradient(135deg, #10b981, #06b6d4);
      border: none;
      color: white;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: all 0.3s ease;
    }

    .login-submit:hover {
      filter: brightness(1.1);
    }

    .login-submit svg {
      width: 16px;
      height: 16px;
    }

    .login-divider {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin: 1.5rem 0;
    }

    .login-divider-line {
      flex: 1;
      height: 1px;
      background: rgba(255, 255, 255, 0.1);
    }

    .login-divider-text {
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.3);
    }

    .login-demo {
      padding: 1rem;
      border-radius: 0.75rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .login-demo-title {
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.4);
      text-align: center;
      margin-bottom: 0.5rem;
    }

    .login-demo-creds {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      font-size: 0.875rem;
      color: rgba(255, 255, 255, 0.6);
    }

    .login-demo-creds code {
      color: #10b981;
    }

    .login-footer {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.3);
    }

    .login-error {
      padding: 1rem;
      border-radius: 0.75rem;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.2);
      color: #ef4444;
      font-size: 0.875rem;
      text-align: center;
    }

    /* Loading spinner */
    .login-spinner {
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="animated-bg">
  <!-- Background decorations -->
  <div class="login-bg-decoration login-bg-1"></div>
  <div class="login-bg-decoration login-bg-2"></div>
  <div class="login-bg-decoration login-bg-3"></div>

  <div class="login-page">
    <div class="login-wrapper">
      <!-- Header -->
      <div class="login-header">
        <img src="/logo.png" alt="A.S JUDGE Logo" style="width: 100px; height: 100px; margin-bottom: 1rem;">
        <h1 class="login-title" style="background: linear-gradient(135deg, #f59e0b, #eab308); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">A.S JUDGE</h1>
        <p class="login-subtitle">Sign in to your admin account</p>
      </div>

      <!-- Login Card -->
      <div class="login-card">
        <form class="login-form" action="/admin/login" method="POST">
          <!-- Error message (EJS) -->
          <!-- <% if (error) { %>
          <div class="login-error"><%= error %></div>
          <% } %> -->

          <!-- Username -->
          <div class="login-field">
            <label class="login-label">Username</label>
            <div class="login-input-wrapper">
              <span class="login-input-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                  <circle cx="12" cy="7" r="4"></circle>
                </svg>
              </span>
              <input type="text" name="username" class="login-input" placeholder="Enter your username" required>
            </div>
          </div>

          <!-- Password -->
          <div class="login-field">
            <label class="login-label">Password</label>
            <div class="login-input-wrapper">
              <span class="login-input-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
              </span>
              <input type="password" name="password" id="password" class="login-input login-input-password" placeholder="Enter your password" required>
              <button type="button" class="login-toggle-password" onclick="togglePassword()">
                <svg id="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>

          <!-- Options -->
          <div class="login-options">
            <label class="login-remember">
              <input type="checkbox" name="remember">
              <span>Remember me</span>
            </label>
            <a href="#" class="login-forgot">Forgot password?</a>
          </div>

          <!-- Submit -->
          <button type="submit" class="login-submit">
            Sign In
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </button>
        </form>

        <!-- Divider -->
        <div class="login-divider">
          <div class="login-divider-line"></div>
          <span class="login-divider-text">OR</span>
          <div class="login-divider-line"></div>
        </div>

        <!-- Demo credentials -->
        <div class="login-demo">
          <p class="login-demo-title">Demo Credentials</p>
          <div class="login-demo-creds">
            <span>Username: <code>admin</code></span>
            <span>Password: <code>admin</code></span>
          </div>
        </div>
      </div>

      <!-- Footer -->
      <p class="login-footer">A.S JUDGE Admin Panel v1.0</p>
    </div>
  </div>

  <script>
    function togglePassword() {
      const input = document.getElementById('password');
      const icon = document.getElementById('eye-icon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
      } else {
        input.type = 'password';
        icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
      }
    }
  </script>
</body>
</html>
