version: '3.8'

services:
  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_TABLETS_PATH: /data/tablets.sqlite
      DB_JUDGES_PATH: /data/judges.sqlite
      SESSION_SECRET: change-me-in-production
    volumes:
      - app_data:/data
    command: sh -c "node src/db/init.js && node src/server.js"
    restart: unless-stopped

volumes:
  app_data:
